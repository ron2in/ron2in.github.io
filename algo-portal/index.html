<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoPortal — Интерактивный портал по алгоритмам и структурам данных</title>
  <meta name="description" content="Изучение алгоритмов и структур данных на базе материалов e-maxx.ru / cp-algorithms с пошаговой визуализацией и синхронизацией с кодом.">
  <meta name="theme-color" content="#A855F7">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Mobile Header -->
    <header class="mobile-header">
      <button id="menu-toggle" class="icon-btn" aria-label="Открыть меню" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="#roadmap" class="brand-logo">
        <span class="brand-icon">{λ}</span>
        <span>AlgoPortal</span>
      </a>
      <span id="mobile-progress-badge" class="badge badge-accent">0%</span>
    </header>

    <!-- Sidebar Backdrop (Mobile) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar" aria-label="Навигация по темам">
      <div class="sidebar-header">
        <a href="#roadmap" class="brand-logo" id="brand-home-link">
          <span class="brand-icon">{λ}</span>
          <div>
            <div class="brand-title">AlgoPortal</div>
            <div class="brand-subtitle">cp-algorithms / e-maxx</div>
          </div>
        </a>
        <button id="sidebar-close" class="icon-btn mobile-only" aria-label="Закрыть меню">✕</button>
      </div>

      <div class="sidebar-search">
        <input type="search" id="topic-search" class="input-field" placeholder="Поиск темы или тега..." autocomplete="off">
      </div>

      <div class="sidebar-progress-box">
        <div class="progress-label-row">
          <span>Прогресс обучения</span>
          <span id="sidebar-progress-text" class="mono">0 / 0</span>
        </div>
        <div class="progress-bar-track">
          <div id="sidebar-progress-fill" class="progress-bar-fill" style="width: 0%"></div>
        </div>
      </div>

      <div class="sidebar-cf-box">
        <div class="cf-sync-row">
          <input type="text" id="cf-handle-input" class="input-field input-mono" placeholder="CF хендл..." autocomplete="off">
          <button type="button" id="cf-sync-btn" class="btn btn-secondary btn-xs">Синхр.</button>
        </div>
        <div id="cf-profile-info" class="cf-profile-info">Профиль CF не подключён</div>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav">
        <!-- Populated dynamically by js/app.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-tools-grid">
          <a href="#calculator" id="nav-calculator-link" class="btn btn-secondary btn-xs">⏱ N → O</a>
          <a href="#generator" class="btn btn-secondary btn-xs">🧪 Тесты</a>
          <a href="#stl" class="btn btn-secondary btn-xs">📚 STL / Py</a>
          <a href="#bitwise" class="btn btn-secondary btn-xs">🔢 Биты</a>
          <a href="#blitz" class="btn btn-secondary btn-xs">⚡ Блиц</a>
          <a href="#debughunt" class="btn btn-secondary btn-xs">🐞 Баги</a>
          <a href="#selector" class="btn btn-secondary btn-xs">🧭 Выбор</a>
          <a href="#timbook" id="open-cheatsheet-btn" class="btn btn-secondary btn-xs">📘 Тимбук <span id="cheatsheet-count" class="badge badge-muted">0</span></a>
        </div>
        <div class="io-actions">
          <button id="export-progress-btn" class="btn btn-secondary btn-xs" title="Сохранить прогресс, заметки и список Тимбука в JSON">💾 Бэкап (.json)</button>
          <label class="btn btn-secondary btn-xs import-label" title="Загрузить прогресс, заметки и список Тимбука из JSON">
            📂 Загрузить
            <input type="file" id="import-progress-input" accept=".json,application/json" hidden>
          </label>
        </div>
        <div class="sidebar-net-row">
          <span id="net-status-pill" class="badge badge-success" style="font-size:10.5px;">● Online</span>
          <button id="cache-all-btn" class="btn btn-ghost btn-xs" title="Предзагрузить все темы в офлайн-кэш">📥 Кэш офлайн</button>
        </div>
      </div>
    </aside>

    <!-- Workspace Column -->
    <div class="workspace-column">
      <div class="contest-timer-bar" id="contest-timer-bar">
        <div class="timer-left">
          <a href="https://ron2in.github.io/" class="btn btn-secondary btn-xs" style="text-decoration:none; white-space:nowrap;" title="На главную ron2in.github.io">← Главная</a>
          <span class="badge badge-accent">Таймер контеста</span>
          <select id="timer-mode-select" class="select-field timer-select" aria-label="Режим таймера">
            <option value="stopwatch">Секундомер</option>
            <option value="pomo25">Pomodoro 25 мин</option>
            <option value="pomo5">Перерыв 5 мин</option>
            <option value="custom">Контест (мин)</option>
          </select>
          <input id="timer-custom-mins" type="number" class="input-field input-mono timer-mins-input" value="120" min="1" max="600" hidden aria-label="Минуты">
        </div>
        <div class="timer-right">
          <span id="timer-display" class="mono timer-display">00:00</span>
          <button type="button" id="timer-start-btn" class="btn btn-primary btn-xs">▶ Старт</button>
          <button type="button" id="timer-reset-btn" class="btn btn-ghost btn-xs">↺ Сброс</button>
          <button type="button" id="projector-mode-btn" class="btn btn-secondary btn-xs" title="Режим проектора (F или Alt+P)">📽 Проектор</button>
        </div>
      </div>

      <!-- Main Workspace -->
      <main id="main-content" class="main-content">
        <!-- Dynamic view rendered by js/app.js -->
      </main>
    </div>
  </div>

  <!-- Print-only Cheatsheet Container -->
  <section id="print-cheatsheet-area" class="print-only-area" aria-hidden="true"></section>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
