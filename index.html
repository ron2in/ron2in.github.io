<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ron2in — Портал проектов и веб-приложений</title>
  <style>
    :root {
      --bg-app: #090c12;
      --bg-panel: #111621;
      --bg-card: #171e2b;
      --bg-card-hover: #1e2738;
      --border: #273144;
      --border-light: #384661;
      --text-main: #edf2f7;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.22);
      --tonic: #34d399;
      --tonic-bg: rgba(52, 211, 153, 0.14);
      --radius: 14px;
      --radius-sm: 8px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg-app);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      background-image:
        radial-gradient(circle at 18% 0%, rgba(56, 189, 248, 0.12), transparent 42%),
        radial-gradient(circle at 85% 12%, rgba(52, 211, 153, 0.08), transparent 36%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 24px;
      background: rgba(17, 22, 33, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 16px;
      color: #090c12;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.03em;
    }

    .brand-sub {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: -2px;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      transition: 0.15s ease;
    }

    .pill-link:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .main {
      flex: 1;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 20px calc(40px + env(safe-area-inset-bottom));
    }

    .hero {
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      align-self: flex-start;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--tonic-bg);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: var(--tonic);
      font-size: 12px;
      font-weight: 700;
    }

    .hero h1 {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .hero p {
      color: var(--text-muted);
      max-width: 640px;
      font-size: 15px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      max-width: 380px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .count-label {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-dim);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-pill {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: 0.14s ease;
    }

    .filter-pill:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .filter-pill.active {
      background: rgba(56, 189, 248, 0.14);
      border-color: var(--accent);
      color: var(--accent);
    }

    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .site-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    .site-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--bg-card-hover);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
    }

    .site-card.is-soon {
      opacity: 0.7;
      border-style: dashed;
      cursor: default;
    }

    .site-card.is-soon:hover {
      transform: none;
      border-color: var(--border);
      background: var(--bg-card);
      box-shadow: none;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
      background: var(--bg-panel);
      border: 1px solid var(--border-light);
    }

    .status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-live {
      background: var(--tonic-bg);
      color: var(--tonic);
      border: 1px solid rgba(52, 211, 153, 0.35);
    }

    .status-soon {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .status-gh {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-pill {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: 0.14s;
    }

    .filter-pill:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .filter-pill.active {
      background: var(--bg-card-hover);
      color: var(--accent);
      border-color: var(--accent);
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      flex: 1;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .card-url {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .card-cta {
      color: var(--accent);
    }

    .footer {
      text-align: center;
      padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12.5px;
      background: var(--bg-panel);
    }

    @media (max-width: 640px) {
      .topbar { padding: 12px 14px; }
      .main { padding: 22px 14px calc(28px + env(safe-area-inset-bottom)); }
      .sites-grid { grid-template-columns: 1fr; }
      .search-input { max-width: 100%; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="./">
      <div class="brand-icon">R2</div>
      <div>
        <span class="brand-title">ron2in.github.io</span>
        <span class="brand-sub">Главный портал проектов</span>
      </div>
    </a>

    <div class="top-links">
      <a class="pill-link" href="https://github.com/ron2in" target="_blank" rel="noopener">Профиль GitHub</a>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <span class="hero-badge">● Портал приложений</span>
      <h1>Мои сайты и проекты на GitHub</h1>
      <p>Единая точка входа для всех проектов <strong>ron2in</strong>. Новые публичные репозитории и сайты GitHub Pages подгружаются автоматически.</p>
    </section>

    <div class="toolbar">
      <input id="siteSearch" class="search-input" type="search" placeholder="Поиск по названию, описанию или тегу..." aria-label="Поиск сайтов" />
      <div class="filter-pills" id="filterPills">
        <button class="filter-pill active" data-kind="all">Все</button>
        <button class="filter-pill" data-kind="site">Сайты (Pages)</button>
        <button class="filter-pill" data-kind="repo">Репозитории</button>
      </div>
      <span id="siteCount" class="count-label"></span>
    </div>

    <section id="sitesGrid" class="sites-grid"></section>
  </main>

  <footer class="footer">
    ron2in.github.io · Список синхронизируется с GitHub автоматически
  </footer>

  <script>
    const GITHUB_USER = 'ron2in';

    // Закреплённые проекты с ручным описанием (всегда сверху)
    const PINNED_SITES = [
      {
        repo: 'harmony-lab',
        title: 'Harmony & Chord Lab',
        desc: 'Тренажёр по теории музыки: ноты с нуля, построение аккордов и интервалов, слуховой анализ, справочник формул, гармоническая песочница и 4-голосная гармонизация.',
        url: 'https://ron2in.github.io/harmony-lab/',
        displayUrl: '/harmony-lab/',
        icon: '🎹',
        kind: 'site',
        tags: ['Музыка', 'Тренажёр', 'Web Audio', 'ПК + Телефон']
      }
    ];

    let allItems = [...PINNED_SITES];
    let activeKind = 'all';

    const grid = document.getElementById('sitesGrid');
    const searchInput = document.getElementById('siteSearch');
    const countEl = document.getElementById('siteCount');

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function renderSites() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allItems.filter(s => {
        const matchKind = activeKind === 'all' || s.kind === activeKind;
        const matchQuery = !q ||
          s.title.toLowerCase().includes(q) ||
          s.desc.toLowerCase().includes(q) ||
          s.tags.some(t => t.toLowerCase().includes(q));
        return matchKind && matchQuery;
      });

      countEl.textContent = `Проектов: ${filtered.length}`;
      grid.innerHTML = '';

      if (!filtered.length) {
        grid.innerHTML = `<div style="color:var(--text-muted); padding:24px 0;">Ничего не найдено.</div>`;
        return;
      }

      filtered.forEach(site => {
        const isSite = site.kind === 'site';
        const card = document.createElement('a');
        card.className = 'site-card';
        card.href = site.url;
        if (!site.url.startsWith('./') && !site.url.startsWith('/')) {
          card.target = '_blank';
          card.rel = 'noopener';
        }

        card.innerHTML = `
          <div class="card-top">
            <div class="card-icon">${site.icon}</div>
            <span class="status-pill ${isSite ? 'status-live' : 'status-soon'}">${isSite ? 'Сайт' : 'GitHub'}</span>
          </div>
          <div class="card-title">${escapeHtml(site.title)}</div>
          <div class="card-desc">${escapeHtml(site.desc)}</div>
          <div class="tags-row">
            ${site.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          </div>
          <div class="card-footer">
            <span class="card-url">${escapeHtml(site.displayUrl)}</span>
            <span class="card-cta">${isSite ? 'Открыть сайт →' : 'Открыть код →'}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function loadGitHubProjects() {
      try {
        const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?sort=updated&per_page=100`);
        if (!res.ok) return;
        const repos = await res.json();
        const pinnedNames = new Set(PINNED_SITES.map(p => p.repo.toLowerCase()));

        const fetched = repos
          .filter(r => !r.private && r.name.toLowerCase() !== `${GITHUB_USER}.github.io` && !pinnedNames.has(r.name.toLowerCase()))
          .map(r => {
            const hasSite = Boolean(r.has_pages || (r.homepage && r.homepage.trim()));
            const siteUrl = (r.homepage && r.homepage.trim())
              ? r.homepage.trim()
              : (r.has_pages ? `https://${GITHUB_USER}.github.io/${r.name}/` : r.html_url);

            const tags = [];
            if (r.language) tags.push(r.language);
            if (r.has_pages) tags.push('GitHub Pages');
            if (r.fork) tags.push('Fork');
            if (r.stargazers_count > 0) tags.push(`★ ${r.stargazers_count}`);
            if (!tags.length) tags.push('Репозиторий');

            return {
              repo: r.name,
              title: r.name,
              desc: r.description || 'Публичный репозиторий на GitHub.',
              url: hasSite ? siteUrl : r.html_url,
              displayUrl: hasSite ? `/${r.name}/` : `github.com/${GITHUB_USER}/${r.name}`,
              icon: hasSite ? '🌐' : '📦',
              kind: hasSite ? 'site' : 'repo',
              tags
            };
          });

        allItems = [...PINNED_SITES, ...fetched];
        renderSites();
      } catch {
        // Если API недоступен, остаётся список PINNED_SITES
      }
    }

    document.getElementById('filterPills').addEventListener('click', e => {
      const btn = e.target.closest('.filter-pill');
      if (!btn) return;
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeKind = btn.dataset.kind;
      renderSites();
    });

    searchInput.addEventListener('input', renderSites);
    renderSites();
    loadGitHubProjects();
  </script>
</body>
</html>
